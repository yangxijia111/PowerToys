name: "🕷️ Bug report / 问题反馈"
description: Report errors or unexpected behavior in PowerToys Cuin (报告错误或异常行为)
labels:
- Issue-Bug
- Needs-Triage
body:
- type: markdown
  attributes:
    value: |
      Thanks for helping improve **PowerToys Cuin**! Before filing, please [search existing issues in this repository](https://github.com/yangxijia111/PowerToys/issues) — the upstream [microsoft/PowerToys](https://github.com/microsoft/PowerToys/issues) tracker may also be relevant for core-module bugs.
      感谢帮助改进 **PowerToys Cuin**！提交前请先[在本仓库搜索已有 Issue](https://github.com/yangxijia111/PowerToys/issues)；核心模块问题也可参考上游 [microsoft/PowerToys](https://github.com/microsoft/PowerToys/issues)。

      **Known limitations of the current preview（当前预览版已知限制，非 Bug）**：安装包未签名（SmartScreen 可能提示"未知发布者"）；Win11 新式右键菜单（PowerRename / Image Resizer / File Locksmith / New+）不可用（经典右键菜单正常）；自动更新已禁用需手动下载；不支持与官方 PowerToys 共存。
- id: version
  type: input
  attributes:
    label: PowerToys Cuin version（Cuin 版本）
    placeholder: 0.1.0-preview.1
    description: Shown in Settings > General > About (or the tray icon "About" dialog). 设置 > 通用 > 关于（或托盘"关于"）中查看。
  validations:
    required: true

- id: windows_version
  type: input
  attributes:
    label: Windows version（Windows 版本）
    placeholder: "Windows 11 23H2 Build 22631.4460 / Windows 10 22H2 Build 19045.5011"
    description: Run `winver` to find it. 可运行 `winver` 查看。
  validations:
    required: true

- id: install_scope
  type: dropdown
  attributes:
    label: Installation scope（安装范围）
    options:
      - perUser（默认 Bootstrapper EXE 安装）
      - perMachine（MSI 安装）
      - Not sure（不确定）
  validations:
    required: true

- id: installed
  type: dropdown
  attributes:
    label: Installation method（安装方式）
    description: How did you install PowerToys Cuin? 你是如何安装的？
    options:
      - Bootstrapper EXE（PowerToysCuin-*.exe，默认）
      - perUser MSI
      - perMachine MSI
      - Dev build in Visual Studio（本地构建）
      - Other（请在复现步骤中说明）
  validations:
    required: true

- id: official_coexist
  type: dropdown
  attributes:
    label: Was the official Microsoft PowerToys ever installed on this machine?（本机是否曾安装官方 PowerToys）
    description: Leftover official registrations can affect shell extensions and settings. 官方残留注册可能影响 Shell 扩展与设置。
    options:
      - "No（从未安装）"
      - "Yes - fully uninstalled before Cuin（安装过，装 Cuin 前已完全卸载）"
      - "Yes - still installed alongside（仍在，与 Cuin 同时安装——注意：不受支持的共存场景）"
      - Not sure（不确定）
  validations:
    required: true

- id: win11_menu
  type: dropdown
  attributes:
    label: Are you using the Win11 modern (sparse MSIX) context menu?（是否在用 Win11 新式右键菜单场景）
    description: Unsigned preview cannot register the modern menu; classic menu works. 未签名预览版无法注册新式菜单；经典菜单可用。
    options:
      - "Yes - issue involves the modern right-click menu（问题与新式右键菜单相关）"
      - "No - classic menu（使用经典菜单）"
      - "Not applicable（不涉及右键菜单）"
  validations:
    required: false

- type: dropdown
  attributes:
    label: Area(s) with issue?（问题涉及哪些工具）
    description: Check all that apply. 可多选。
    multiple: true
    options:
      - General
      - Advanced Paste
      - Always on Top
      - Awake
      - ColorPicker
      - Command not found
      - Command Palette
      - Crop and Lock
      - Environment Variables
      - FancyZones
      - FancyZones Editor
      - Grab And Move
      - File Locksmith
      - "File Explorer: Preview Pane"
      - "File Explorer: Thumbnail preview"
      - Hosts File Editor
      - Image Resizer
      - Installer
      - Keyboard Manager
      - Light Switch
      - Mouse Utilities
      - Mouse Without Borders
      - New+
      - Peek
      - Power Display
      - PowerRename
      - PowerToys Run
      - Quick Accent
      - Registry Preview
      - Screen ruler
      - Settings
      - Shortcut Guide
      - System tray interaction
      - TextExtractor
      - Window Hopper
      - Workspaces
      - Welcome / PowerToys Tour window
      - ZoomIt
  validations:
    required: true

- type: textarea
  attributes:
    label: Steps to reproduce（复现步骤）
    placeholder: |
      Detailed steps help us reproduce the bug. 详细步骤有助于复现问题。
  validations:
    required: true

- type: textarea
  attributes:
    label: "✔️ Expected Behavior（预期行为）"
  validations:
    required: false

- type: textarea
  attributes:
    label: "❌ Actual Behavior（实际行为）"
  validations:
    required: false

- type: upload
  id: bugreportfile
  attributes:
    label: Upload Bug Report ZIP-file（可选：上传诊断包）
    description: |
      Right-click the PowerToys tray icon > "Report bug" generates a ZIP with diagnostic info and logs. 右键托盘图标 > "Report bug" 可生成含诊断信息与日志的 ZIP。

      **Privacy check before uploading（上传前隐私自查）**：logs may contain file paths and your Windows username — review and redact as needed; do NOT upload passwords, tokens, private keys, or sensitive personal files. 日志可能包含文件路径与用户名，请先检查并按需涂改；**禁止**上传密码、Token、私钥或敏感个人文件。
  validations:
    required: false

- id: additionalInfo
  type: textarea
  attributes:
    label: Additional Information（其他信息）
    placeholder: |
      System language / 系统语言
      Running as admin / 是否以管理员运行
      Whether PowerToys starts on boot / 是否开机自启
  validations:
    required: false

- type: textarea
  attributes:
    label: Other Software（相关其他软件）
    description: If the bug involves interaction with other software, what software and versions? 若与其他软件交互相关，请注明软件与版本。
  validations:
    required: false
