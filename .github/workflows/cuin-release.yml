# [fork-identity] fork Release 构建流水线。
# 触发：手动 (workflow_dispatch) 或 push v* tag。**只上传构建 artifact，不创建 GitHub Release、
# 不发布资产**——公开发布必须经项目负责人明确确认（docs/RELEASE_CHECKLIST.md §8）。
#
# 构建 / restore 方式对齐上游 .pipelines/v2/templates：
# - packages.config 形式的 C++ 原生包由 MSBuild restore + RestorePackagesConfig=true 还原；
# - 安装器按上游 steps-build-installer-vnext.yml 顺序构建：支持 DLL（构建事件完成 .wxs
#   备份与文件清单生成）→ perMachine MSI → perUser MSI → Bootstrapper。
name: Cuin Release Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-release:
    name: Release x64 + Installer
    runs-on: windows-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup Python (checks)
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Static checks
        run: |
          python tools/check_fork_identity.py
          python tools/check_zh_cn_coverage.py --fail-on-orphan
          python tools/check_release_assets.py
          python tools/check_sparse_registration.py
          python tools/check_upgrade_chain.py

      - name: Restore & full Release build (PowerToys.slnx)
        shell: cmd
        run: msbuild PowerToys.slnx /restore /p:RestorePackagesConfig=true /p:Configuration=Release /p:Platform=x64 /m /v:m /nologo

      # 上游 job-build-project.yml 在主构建外还构建两个工具解决方案并生成 DSC
      # manifests——安装器 Tools.wxs / DscResources.wxs 的 payload 依赖它们
      # （x64\Release\Tools\、x64\Release\StylesReportTool\、x64\Release\DSCModules\）。
      - name: Generate DSC manifests
        shell: pwsh
        run: .\.pipelines\generateDscManifests.ps1 -BuildPlatform 'x64' -BuildConfiguration 'Release' -RepoRoot "$env:GITHUB_WORKSPACE"

      - name: Build BugReportTool
        shell: cmd
        run: msbuild tools\BugReportTool\BugReportTool.sln -restore -graph /p:RestorePackagesConfig=true /p:CIBuild=true /p:Configuration=Release /p:Platform=x64 /m /v:m /nologo

      - name: Build StylesReportTool
        shell: cmd
        run: msbuild tools\StylesReportTool\StylesReportTool.sln -restore -graph /p:RestorePackagesConfig=true /p:CIBuild=true /p:Configuration=Release /p:Platform=x64 /m /v:m /nologo

      - name: Publish installer payload (preview handlers)
        shell: cmd
        run: cd installer\PowerToysSetupVNext && publish.cmd x64

      - name: Build CmdPal msix (CIBuild)
        shell: cmd
        run: msbuild src\modules\cmdpal\Microsoft.CmdPal.UI\Microsoft.CmdPal.UI.csproj /p:Configuration=Release /p:Platform=x64 /p:CIBuild=true /m /v:q /nologo

      # CustomActions 工程链接 wcautil.lib/dutil.lib，vcxproj 硬编码从
      # $(NUGET_PACKAGES)\wixtoolset.wcautil\<ver>\build\native\v14\x64 取库（全局包
      # 布局）。WixToolset.WcaUtil 只存在于 CA 的 packages.config（旧式还原布局不同），
      # 也不在 Wix SDK 的 PackageReference 依赖链里，全新环境不会出现。用 shim csproj
      # 把 CA packages.config 声明的原生包按全局布局还原进默认全局包目录。
      - name: Restore WiX native libs for installer CA (wcautil/dutil)
        shell: pwsh
        run: |
          $pkg = [xml](Get-Content installer\PowerToysSetupCustomActionsVNext\packages.config)
          $refs = ($pkg.packages.package | ForEach-Object {
            '<PackageReference Include="{0}" Version="{1}" />' -f $_.id, $_.version
          }) -join "`n"
          $shimDir = Join-Path $env:RUNNER_TEMP 'wix-ca-restore'
          New-Item -ItemType Directory -Force -Path $shimDir | Out-Null
          @"
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>netstandard2.0</TargetFramework>
              <EnableDefaultCompileItems>false</EnableDefaultCompileItems>
            </PropertyGroup>
            <ItemGroup>
          $refs
            </ItemGroup>
          </Project>
          "@ | Set-Content (Join-Path $shimDir 'wix-ca-restore.csproj')
          dotnet restore (Join-Path $shimDir 'wix-ca-restore.csproj')

      # 上游 steps-build-installer-vnext.yml：先构建 CustomActions / SilentFilesInUseBA，
      # 前者的构建事件完成 .wxs → .bk 备份与 generateAllFileComponents 文件清单生成。
      #
      # 随后的 MSI 构建不沿用上游的 IsPipeline=1 环境变量方案：Resources.wxs 的 21 语言
      # 本地化资源块以 env.IsPipeline 门控，上游配套从其本地化流水线下载各语言卫星资源，
      # fork 无法获取这些产物。因此这里用 /p:PreBuildEvent= 清空 prebuild（publish.cmd
      # 已在前面单独执行；MonacoSRC.wxs 由下方步骤显式生成），并用
      # RunBuildEvents=false 清空 PostBuildEvent（防止 .wxs 被回退成未生成状态）。
      - name: Build installer support DLLs + prep wxs
        shell: cmd
        env:
          NUGET_PACKAGES: C:\Users\runneradmin\.nuget\packages
        run: msbuild installer\PowerToysSetup.slnx -restore -graph /t:"PowerToysSetupCustomActionsVNext;SilentFilesInUseBAFunction" /p:RunBuildEvents=true /p:RestorePackagesConfig=true /p:CIBuild=true /p:Configuration=Release /p:Platform=x64 /m /v:m /nologo

      # MonacoSRC.wxs 是 gitignore 的生成文件（MSI prebuild 里 generateMonacoWxs.ps1
      # 的产物，prebuild 已被清空），全新检出不存在。用仓库自带脚本显式生成，
      # heat 工具路径取自全局包目录（WixToolset.Heat 经 MSI 工程 PackageReference 还原）。
      - name: Generate MonacoSRC.wxs (heat harvest)
        shell: pwsh
        env:
          NUGET_PACKAGES: C:\Users\runneradmin\.nuget\packages
        run: |
          powershell -NoProfile -ExecutionPolicy Unrestricted -File installer\PowerToysSetupVNext\generateMonacoWxs.ps1 -monacoWxsFile "installer\PowerToysSetupVNext\MonacoSRC.wxs" -Platform "x64" -nugetHeatPath "$env:NUGET_PACKAGES\wixtoolset.heat\5.0.2"

      # ===== 可选代码签名（Signed Release 模式，docs/CODE_SIGNING.md §5）=====
      # 未配置签名 secrets（示例名 FORK_CODE_SIGN_PFX_BASE64 / FORK_CODE_SIGN_PFX_PASSWORD）时
      # 以下步骤全部跳过，构建保持 Unsigned Preview 行为，不失败也不伪装已签名。
      # Payload 阶段必须在 MSI 构建前执行：签名结果会被 heat/WiX 打进安装包。
      - name: Sign payload layout (optional)
        shell: pwsh
        env:
          FORK_CODE_SIGN_PFX_BASE64: ${{ secrets.FORK_CODE_SIGN_PFX_BASE64 }}
          FORK_CODE_SIGN_PFX_PASSWORD: ${{ secrets.FORK_CODE_SIGN_PFX_PASSWORD }}
        if: env.FORK_CODE_SIGN_PFX_BASE64 != ''
        run: |
          $ErrorActionPreference = 'Stop'
          $pfx = Join-Path $env:RUNNER_TEMP 'fork-sign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:FORK_CODE_SIGN_PFX_BASE64))
          try {
            # 主 payload 布局（x64\Release，安装后落盘的全部 EXE/DLL/MSIX）+ 安装器 CA DLL
            & tools\fork_sign_assets.ps1 -Stage Payload -Root 'x64\Release' -PfxPath $pfx -PfxPassword $env:FORK_CODE_SIGN_PFX_PASSWORD
            & tools\fork_sign_assets.ps1 -Stage Payload -Root 'installer\PowerToysSetupCustomActionsVNext\x64\Release' -PfxPath $pfx -PfxPassword $env:FORK_CODE_SIGN_PFX_PASSWORD
          }
          finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }


      # MSI 构建附加说明：
      # - EnableDefaultEmbeddedResourceItems=false：wixproj 默认 glob **/*.wxl 会把
      #   Bootstrapper obj 目录中扩展生成的 RtfTheme.wxl（en-us）误当作本地化资源，
      #   导致 MSI 产物落到 en-us\ 子目录且 Bootstrapper 按根路径引用 MSI 时失败；
      #   工程内并无真实 wxl，关闭该默认项即可恢复根目录的 neutral 输出。
      - name: Build perMachine MSI
        shell: cmd
        run: msbuild installer\PowerToysSetup.slnx -restore /t:PowerToysInstallerVNext /p:RunBuildEvents=false /p:PreBuildEvent= /p:PerUser=false /p:BuildProjectReferences=false /p:CIBuild=true /p:EnableDefaultEmbeddedResourceItems=false /p:Configuration=Release /p:Platform=x64 /m /v:m /nologo

      - name: Build perUser MSI
        shell: cmd
        run: msbuild installer\PowerToysSetup.slnx /t:PowerToysInstallerVNext /p:RunBuildEvents=false /p:PreBuildEvent= /p:PerUser=true /p:BuildProjectReferences=false /p:CIBuild=true /p:EnableDefaultEmbeddedResourceItems=false /p:Configuration=Release /p:Platform=x64 /m /v:m /nologo

      # fork 只发布 perUser Bootstrapper 作为默认 EXE（perMachine 用户可直接安装 MSI）
      - name: Build Bootstrapper (perUser)
        shell: cmd
        run: msbuild installer\PowerToysSetup.slnx -restore /t:PowerToysBootstrapperVNext /p:PerUser=true /p:BuildProjectReferences=false /p:CIBuild=true /p:Configuration=Release /p:Platform=x64 /m /v:m /nologo

      # 三件套签名（Signed Release 模式）：必须发生在 Collect artifacts + SHA256 之前，
      # 保证 SHA256SUMS 反映签名后的最终文件。未配置 secrets 时跳过（Unsigned Preview）。
      - name: Sign installers + verify (optional)
        shell: pwsh
        env:
          FORK_CODE_SIGN_PFX_BASE64: ${{ secrets.FORK_CODE_SIGN_PFX_BASE64 }}
          FORK_CODE_SIGN_PFX_PASSWORD: ${{ secrets.FORK_CODE_SIGN_PFX_PASSWORD }}
        if: env.FORK_CODE_SIGN_PFX_BASE64 != ''
        run: |
          $ErrorActionPreference = 'Stop'
          $pfx = Join-Path $env:RUNNER_TEMP 'fork-sign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:FORK_CODE_SIGN_PFX_BASE64))
          try {
            & tools\fork_sign_assets.ps1 -Stage Installers -Root 'installer\PowerToysSetupVNext\x64\Release\UserSetup' -PfxPath $pfx -PfxPassword $env:FORK_CODE_SIGN_PFX_PASSWORD
            & tools\fork_sign_assets.ps1 -Stage Installers -Root 'installer\PowerToysSetupVNext\x64\Release\MachineSetup' -PfxPath $pfx -PfxPassword $env:FORK_CODE_SIGN_PFX_PASSWORD
          }
          finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }
          # 签名模式 gate：三件套必须全部具有有效签名，否则失败（不伪装）
          & tools\fork_sign_assets.ps1 -Stage Installers -Root 'installer\PowerToysSetupVNext\x64\Release\UserSetup' -Verify
          & tools\fork_sign_assets.ps1 -Stage Installers -Root 'installer\PowerToysSetupVNext\x64\Release\MachineSetup' -Verify


      - name: Run unit tests
        shell: pwsh
        run: |
          $dll = "Release\x64\tests\SettingsTests\net10.0-windows10.0.26100.0\Settings.UI.UnitTests.dll"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -property installationPath
          if (-not $vsPath) { throw "vswhere found no Visual Studio installation" }
          $vstest = @(
            (Join-Path $vsPath "Common7\IDE\CommonExtensions\Microsoft\TestWindow\vstest.console.exe"),
            (Join-Path $vsPath "Common7\IDE\Extensions\TestPlatform\vstest.console.exe")
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $vstest) { throw "vstest.console.exe not found under $vsPath" }
          & $vstest $dll /logger:"console;verbosity=normal"

      - name: Run C++ common unit tests
        shell: pwsh
        run: |
          $dll = "x64\Release\tests\UnitTestsCommonUtils\Common.Utils.UnitTests.dll"
          if (-not (Test-Path $dll)) { throw "Common.Utils.UnitTests.dll not found" }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -property installationPath
          if (-not $vsPath) { throw "vswhere found no Visual Studio installation" }
          $vstest = @(
            (Join-Path $vsPath "Common7\IDE\CommonExtensions\Microsoft\TestWindow\vstest.console.exe"),
            (Join-Path $vsPath "Common7\IDE\Extensions\TestPlatform\vstest.console.exe")
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $vstest) { throw "vstest.console.exe not found under $vsPath" }
          # 3 个 pipe 安全测试需要提权会话（上游 CI 在提权 agent 上执行全部测试；
          # GitHub 托管 runner 无法提供）。排除并显式标记“未执行（环境限制）”，
          # 不计为通过也不计为失败。记录见 docs/RELEASE_CHECKLIST.md。
          $elevated = @(
            'RejectedClientRapidCloseNeverReleasesPipeName',
            'ReplacementListenerIsReservedBeforeRejectedHandlerStarts',
            'NormalSameUserCannotModifyProtectedDaclOrCreateAnotherServerInstance'
          )
          $filter = ($elevated | ForEach-Object { "FullyQualifiedName!~$_" }) -join '&'
          & $vstest $dll "/TestCaseFilter:$filter" /logger:"console;verbosity=normal"
          Write-Output "::warning::C++ pipe 安全测试 3 项未执行（需提权环境）：$($elevated -join ', ')"

      # 资产收集：期望文件名清单与 Version.props / 安装器工程的同步由
      # tools/check_release_assets.py（本 workflow 的 Static checks 步骤）强制保证；
      # 缺任一资产 / 出现在多个位置 / 目标重名一律立即失败；SHA256SUMS 使用最终发布文件名。
      - name: Collect artifacts + SHA256
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # 改版本号时必须同步更新此清单（check_release_assets.py 会在构建前拦截遗漏）
          $expected = @(
            "PowerToysCuin-0.1.0-preview.1-x64.exe",
            "PowerToysCuin-0.1.0-preview.1-x64-perUser.msi",
            "PowerToysCuin-0.1.0-preview.1-x64-perMachine.msi"
          )
          $roots = @(
            "installer\PowerToysSetupVNext\x64\Release\UserSetup",
            "installer\PowerToysSetupVNext\x64\Release\MachineSetup"
          )
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          foreach ($name in $expected) {
            $found = @($roots | ForEach-Object { Join-Path $_ $name } | Where-Object { Test-Path $_ })
            if ($found.Count -eq 0) { throw "缺少预期发行资产：$name（产物清单见 installer\PowerToysSetupVNext\x64\Release）" }
            if ($found.Count -gt 1) { throw "资产 $name 出现在多个位置：$($found -join ', ')" }
            $dest = Join-Path 'artifacts' $name
            if (Test-Path $dest) { throw "目标已存在，拒绝覆盖：$dest" }
            Copy-Item $found[0] $dest
          }
          $payload = Get-ChildItem artifacts -File | Where-Object Name -ne 'SHA256SUMS.txt' | Sort-Object Name
          $hashes = foreach ($f in $payload) { "{0}  {1}" -f (Get-FileHash $f.FullName -Algorithm SHA256).Hash, $f.Name }
          $hashes | Set-Content artifacts\SHA256SUMS.txt
          # artifact 目录必须恰好包含 4 个文件
          $finalNames = (Get-ChildItem artifacts -File).Name | Sort-Object
          $wanted = ($expected + @('SHA256SUMS.txt')) | Sort-Object
          $diff = Compare-Object $finalNames $wanted
          if ($diff) { throw "artifact 目录与预期资产清单不一致：`n$($diff | Out-String)" }
          Get-ChildItem artifacts -File | Sort-Object Name | Format-Table Name, Length -AutoSize
          Get-Content artifacts\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: cuin-release-candidate
          path: artifacts/*
          if-no-files-found: error
