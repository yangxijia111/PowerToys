# [fork-identity] fork 自有 CI：push / PR 时的快速验证。
# 重型构建（Release 全量 + 安装器）见 release workflow（cuin-release.yml，手动/打 tag 触发）。
name: Cuin CI

on:
  push:
    # [fork-feature] feature/* 分支同样跑快速 CI（功能合回 cuin-dev 前先验证）
    branches: [cuin-dev, main, "feature/*"]
  pull_request:
    branches: [cuin-dev, main]

permissions:
  contents: read

jobs:
  static-checks:
    name: Static checks (identity & zh-CN)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Fork identity check
        run: python tools/check_fork_identity.py
      - name: zh-CN coverage check
        run: python tools/check_zh_cn_coverage.py --fail-on-orphan
      - name: Release asset naming check
        run: python tools/check_release_assets.py
      - name: Sparse MSIX registration guard check
        run: python tools/check_sparse_registration.py
      - name: Preview upgrade chain check
        run: python tools/check_upgrade_chain.py
      # [fork-feature] Cuin 自有模块一致性检查（事件名/注册点/resw 双语）
      - name: Cuin custom modules check
        run: python tools/check_cuin_modules.py

  build-and-test:
    name: Build core & unit tests (x64 Release)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # [fork-infra] vcpkg 预还原 + 二进制缓存：在 MSBuild 之前用与 integration
      # 完全相同的参数显式完成 vcpkg install（有限重试，退出码语义不削弱），使
      # MSBuild 内的 vcpkg install 成为无下载 no-op，避免下载镜像瞬时故障的
      # "error :" 日志文本被 MSBuild Exec 解析为 MSB3077。详见 action 内注释。
      - name: Restore vcpkg dependencies (pre-install + binary cache)
        uses: ./.github/actions/vcpkg-restore

      # 上游构建方式（.pipelines/v2/templates/job-build-project.yml）：packages.config
      # 形式的 C++ 原生包（CppWinRT / ImplementationLibrary 等）由 MSBuild restore 配合
      # RestorePackagesConfig=true 还原到仓库根 packages\ 目录；单纯 /restore 只处理
      # PackageReference，会漏掉这些包。这里先在解决方案级做一次完整 restore，再构建
      # 单个工程。
      - name: Restore solution (incl. packages.config)
        run: msbuild PowerToys.slnx /t:Restore /p:RestorePackagesConfig=true /p:Configuration=Release /p:Platform=x64 /m /v:m /nologo

      - name: Build runner (C++ toolchain sanity)
        run: msbuild src\runner\runner.vcxproj /p:Configuration=Release /p:Platform=x64 /m /v:m /nologo

      # [fork-feature] Cuin Quick Actions：C++ 壳 + C# 逻辑库/测试工程
      - name: Build Cuin Quick Actions module
        run: msbuild src\modules\cuin\cuinquickactions\cuinquickactions.vcxproj /p:Configuration=Release /p:Platform=x64 /m /v:m /nologo

      - name: Build Settings unit tests
        run: msbuild src\settings-ui\Settings.UI.UnitTests\Settings.UI.UnitTests.csproj /restore /p:Configuration=Release /p:Platform=x64 /m /v:q /nologo

      # vswhere 定位 VS 安装路径再找 vstest（GH runner 的 VS 在 Program Files 下，
      # 且镜像版本会变化，不能只搜 Program Files (x86)）
      - name: Run Settings unit tests
        shell: pwsh
        run: |
          $dll = "Release\x64\tests\SettingsTests\net10.0-windows10.0.26100.0\Settings.UI.UnitTests.dll"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -property installationPath
          if (-not $vsPath) { throw "vswhere found no Visual Studio installation" }
          $vstest = @(
            (Join-Path $vsPath "Common7\IDE\CommonExtensions\Microsoft\TestWindow\vstest.console.exe"),
            (Join-Path $vsPath "Common7\IDE\Extensions\TestPlatform\vstest.console.exe")
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $vstest) { throw "vstest.console.exe not found under $vsPath" }
          & $vstest $dll /logger:"console;verbosity=normal"

      # [fork-feature] Cuin Quick Actions 单元测试（纯逻辑层）
      - name: Build & run Cuin Quick Actions unit tests
        shell: pwsh
        run: |
          msbuild src\modules\cuin\CuinQuickActions.UnitTests\CuinQuickActions.UnitTests.csproj /restore /p:Configuration=Release /p:Platform=x64 /m /v:q /nologo
          $dll = "Release\x64\tests\CuinQuickActions.Tests\PowerToys.CuinQuickActions.UnitTests.dll"
          if (-not (Test-Path $dll)) { throw "PowerToys.CuinQuickActions.UnitTests.dll not found" }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -property installationPath
          if (-not $vsPath) { throw "vswhere found no Visual Studio installation" }
          $vstest = @(
            (Join-Path $vsPath "Common7\IDE\CommonExtensions\Microsoft\TestWindow\vstest.console.exe"),
            (Join-Path $vsPath "Common7\IDE\Extensions\TestPlatform\vstest.console.exe")
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $vstest) { throw "vstest.console.exe not found under $vsPath" }
          & $vstest $dll /logger:"console;verbosity=normal"

      - name: Build & run C++ common unit tests
        shell: pwsh
        run: |
          # 单独构建该 vcxproj 时 $(SolutionDir) 为空，OutDir 相对工程目录
          msbuild src\common\UnitTests-CommonUtils\UnitTests-CommonUtils.vcxproj /p:Configuration=Release /p:Platform=x64 /m /v:m /nologo
          $dll = "src\common\UnitTests-CommonUtils\x64\Release\tests\UnitTestsCommonUtils\Common.Utils.UnitTests.dll"
          if (-not (Test-Path $dll)) { throw "Common.Utils.UnitTests.dll not found" }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -property installationPath
          if (-not $vsPath) { throw "vswhere found no Visual Studio installation" }
          $vstest = @(
            (Join-Path $vsPath "Common7\IDE\CommonExtensions\Microsoft\TestWindow\vstest.console.exe"),
            (Join-Path $vsPath "Common7\IDE\Extensions\TestPlatform\vstest.console.exe")
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $vstest) { throw "vstest.console.exe not found under $vsPath" }
          # 提权依赖的 3 个 pipe 安全测试在 GitHub 托管 runner（非提权会话）上无法按
          # 测试设计运行（上游 CI 在提权 agent 上执行全部测试）。这里将它们排除并
          # 显式标记为“未执行（环境限制）”——它们既不算通过也不算失败。
          $elevated = @(
            'RejectedClientRapidCloseNeverReleasesPipeName',
            'ReplacementListenerIsReservedBeforeRejectedHandlerStarts',
            'NormalSameUserCannotModifyProtectedDaclOrCreateAnotherServerInstance'
          )
          $filter = ($elevated | ForEach-Object { "FullyQualifiedName!~$_" }) -join '&'
          & $vstest $dll "/TestCaseFilter:$filter" /logger:"console;verbosity=normal"
          Write-Output "::warning::C++ pipe 安全测试 3 项未执行（需提权环境，GitHub 托管 runner 不满足测试设计）：$($elevated -join ', ')。上游 CI 在提权 agent 上执行；结果记录见 docs/RELEASE_CHECKLIST.md。"
